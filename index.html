<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⌯ Rives | الصفحة الشخصية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --main: #FF4B2B;
      --main2: #FF416C;
      --bg1: #23243c;
      --bg2: #2e294e;
      --accent: #fff;
      --gray: #f3f3f3;
      --footer-bg: linear-gradient(90deg, #2e294e 0%, #ff416c55 70%, #ff4b2b33 100%);
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      font-family: 'Cairo', Arial, sans-serif;
      color: var(--accent);
      background: linear-gradient(120deg, var(--bg1) 0%, var(--bg2) 100%);
      overflow-x: hidden;
      position: relative;
    }
    /* خلفية أنميشن لطيفة */
    .bg-anim {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .gradient {
      position: absolute;
      width: 120vw; height: 120vw;
      min-width: 800px; min-height: 800px;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(1.1);
      background: radial-gradient(ellipse at 38% 60%, #ff416c45 0%, #ff4b2b16 60%, transparent 100%);
      filter: blur(45px) brightness(1.07);
      animation: bgmove 8.7s ease-in-out infinite alternate;
      opacity: 0.72;
    }
    @keyframes bgmove {
      0% {transform: translate(-50%,-48%) scale(1);}
      100% {transform: translate(-50%,-53%) scale(1.13);}
    }
    .main-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 7vw;
      position: relative;
      z-index: 2;
    }
    .profile-area {
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      gap: 44px;
      width: 100%;
      max-width: 900px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .profile-side {
      min-width: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .avatar-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: avatarIn .85s .22s both cubic-bezier(.62,-0.11,.24,1.15);
    }
    @keyframes avatarIn {
      0% { opacity: 0; transform: scale(0.85) translateY(-55px);}
      100% { opacity: 1; transform: none;}
    }
    .avatar-float {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #fff;
      box-shadow: 0 8px 44px #ff416c7a, 0 0 0 16px #fff3;
      background: #fff;
      z-index: 2;
      animation: floatpic 3.3s ease-in-out infinite alternate;
    }
    @keyframes floatpic {
      0% { transform: translateY(0);}
      100% { transform: translateY(13px);}
    }
    .img-glow {
      position: absolute;
      width: 190px; height: 190px;
      border-radius: 50%;
      left: 50%; top: 50%;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle,#ff416c45 30%, transparent 100%);
      filter: blur(10px);
      z-index: 1;
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: .63;}
      100% { opacity: .97;}
    }
    .profile-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 240px;
      max-width: 440px;
      position: relative;
      z-index: 2;
      animation: mainIn .8s .3s both cubic-bezier(.66,-0.03,.29,1.09);
    }
    @keyframes mainIn {
      0% { opacity: 0; transform: translateY(40px) scale(.96);}
      100% { opacity: 1; transform: none;}
    }
    .myname {
      font-size: 2.45rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--main);
      letter-spacing: 2.1px;
      background: linear-gradient(90deg, var(--main), #fff 70%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 1px 14px #ff4b2b2d;
      line-height: 1.2;
      animation: fadeIn .8s .32s both;
    }
    .subtitle {
      font-size: 1.19rem;
      color: #fff;
      opacity: .92;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: .4px;
      animation: fadeIn .7s .43s both;
    }
    @keyframes fadeIn { from{ opacity:0 } to{ opacity:1 } }
    .intro-static {
      color: #ffb4b4;
      background: #fff1;
      font-size: 1.10rem;
      min-height: 35px;
      font-weight: 700;
      letter-spacing: .2px;
      margin-bottom: 19px;
      direction: rtl;
      border-inline-start: 4px solid var(--main);
      padding-inline-start: 13px;
      border-radius: 10px;
      padding-block: 7px;
      font-family: 'Cairo', Arial, sans-serif;
      animation: fadeIn .7s .51s both;
    }
    .links {
      display: flex;
      justify-content: flex-end;
      gap: 23px;
      margin-bottom: 20px;
      animation: fadeIn .65s .67s both;
    }
    .links a {
      color: var(--main2);
      background: #fff;
      border-radius: 50%;
      width: 48px; height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.39rem;
      transition: background .19s, color .17s, transform .14s;
      text-decoration: none;
      box-shadow: 0 2px 18px #ff416c33;
      border: none;
    }
    .links a:hover {
      background: var(--main2);
      color: #fff;
      transform: scale(1.14) rotate(-7deg);
    }
    .skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 8px;
      animation: fadeIn .6s .77s both;
    }
    .skill {
      background: #ff416c15;
      color: #ff416c;
      border-radius: 14px;
      padding: 6px 16px;
      font-size: 1.01rem;
      font-weight: 700;
      border: 1px solid #ff416c34;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: background .13s, color .13s;
    }
    .skill:hover {
      background: var(--main2);
      color: #fff;
    }
    /* ======= Footer عصري ====== */
    .footer {
      color: #fff;
      font-size: 1.04rem;
      width: 100vw;
      letter-spacing: .24px;
      text-align: center;
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 11;
      padding: 0 0 0 0;
      opacity: .98;
      background: var(--footer-bg);
      backdrop-filter: blur(4px) brightness(1.06);
      box-shadow: 0 -2px 22px #ff416c2c;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .footer span {
      font-weight: bold;
      color: var(--main2);
      margin-left: 7px;
      margin-right: 7px;
      letter-spacing: .5px;
    }
    /* Responsive */
    @media (max-width: 900px) {
      .main-section {padding: 0 2vw;}
      .profile-area {max-width: 99vw;}
      .profile-main {max-width: 99vw;}
    }
    @media (max-width: 700px) {
      .profile-area {flex-direction: column; gap: 10px;}
      .profile-main, .profile-side {align-items: center;}
      .profile-main {text-align: center;}
      .skills-row, .links {justify-content: center;}
    }
    @media (max-width: 500px) {
      .main-section {padding: 0 1vw;}
      .avatar-wrap {width: 90px; height: 90px;}
      .avatar-float {width: 68px; height: 68px;}
      .img-glow {width: 95px; height: 95px;}
      .myname {font-size: 1.13rem;}
      .subtitle, .intro-static {font-size: .89rem;}
      .links a {width: 28px; height: 28px; font-size: .85rem;}
      .skills-row {gap: 4px;}
      .skill {font-size: .68rem; padding: 4px 7px;}
      .footer {font-size: .93rem; min-height: 40px;}
    }
  </style>
</head>
<body>
  <div class="bg-anim"><div class="gradient"></div></div>
  <div class="main-section">
    <div class="profile-area">
      <div class="profile-side">
        <div class="avatar-wrap">
          <span class="img-glow"></span>
          <img class="avatar-float" src="https://i.ibb.co/7vYXnXM/avatar.png" alt="Avatar">
        </div>
      </div>
      <div class="profile-main">
        <div class="myname">عبدالرحمن | Rives</div>
        <div class="subtitle">مطور تطبيقات & مهتم بالتقنية</div>
        <div class="intro-static">
          شغوف بصناعة حلول تقنية تجمع بين البساطة والإبداع.<br>
          القهوة أولاً… ثم يأتي الكود. ☕️💻
        </div>
        <div class="links">
          <a href="https://t.me/yourusername" title="تليجرام" target="_blank"><i class="fab fa-telegram"></i></a>
          <a href="https://x.com/yourusername" title="تويتر" target="_blank"><i class="fab fa-x-twitter"></i></a>
          <a href="mailto:yourmail@email.com" title="إيميل"><i class="fas fa-envelope"></i></a>
          <a href="https://github.com/yourusername" title="Github" target="_blank"><i class="fab fa-github"></i></a>
        </div>
        <div class="skills-row">
          <div class="skill"><i class="fab fa-apple"></i> Swift</div>
          <div class="skill"><i class="fab fa-html5"></i> HTML</div>
          <div class="skill"><i class="fab fa-css3-alt"></i> CSS</div>
          <div class="skill"><i class="fab fa-python"></i> Python</div>
          <div class="skill"><i class="fas fa-cloud"></i> APIs</div>
          <div class="skill"><i class="fas fa-microchip"></i> Linux</div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">
    <span>&copy; 2025 ⌯ Rives</span> | صُنع بحب 🤎 جميع الحقوق محفوظة
  </div>
</body>
</html>
