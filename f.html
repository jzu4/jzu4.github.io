<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarzStore</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      max-width: 400px;
      width: 100%;
      padding: 30px 25px;
      text-align: center;
      transition: 0.3s;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .version {
      background-color: rgba(0, 255, 170, 0.15);
      border: 1px solid #00ffaa;
      color: #00ffaa;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .message {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 30px;
      color: #eee;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      transition: 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn.whatsapp {
      background-color: #25D366;
    }

    .btn.codes {
      background-color: #FF6B35;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="logo" src="your-logo.png" alt="logo">
    <div class="title">StarzStore</div>
    <div class="subtitle">خلّي التطبيقات تشتغل على مزاجك</div>

    <div class="version">
      <i class="bi bi-phone"></i> الإصدار: 17.10 | آخر تحديث: يوليو 2025
    </div>

    <div class="message">
      شكرًا لثقتك بنا وانضمامك لعالم سناب بلس 🌟<br>
      نعدك بتجربة فريدة مليئة بالمزايا الحصرية والتحكم الإضافي اللي يليق فيك.
    </div>

    <div class="buttons">
      <a href="#" class="btn codes"><i class="bi bi-cart"></i> شراء الأكواد</a>
      <a href="https://wa.me/966XXXXXXXXX" class="btn whatsapp"><i class="bi bi-whatsapp"></i> واتساب</a>
    </div>

    <div class="footer">
      © Starz Store 2025 - جميع الحقوق محفوظة
    </div>
  </div>

</body>
</html>
