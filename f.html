<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StarzPanel - مركز التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .panel {
      width: 100%;
      max-width: 500px;
      background: #1f2937;
      border-radius: 20px;
      padding: 25px 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .panel h1 {
      font-size: 26px;
      margin-bottom: 5px;
      color: #00dc82;
    }

    .panel p.subtitle {
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .status-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .status-box span {
      display: block;
      margin-bottom: 6px;
      color: #0ff;
      font-weight: bold;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .feature {
      background-color: #374151;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      text-align: center;
      background: #00dc82;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      color: #000;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn.secondary {
      background: #3b82f6;
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>StarzPanel</h1>
    <p class="subtitle">لوحة التحكم الخاصة بحسابك</p>

    <div class="status-box">
      <span>الإصدار: 17.10</span>
      <span>آخر تحديث: يوليو 2025</span>
      <span>الحالة: ✅ نشط</span>
    </div>

    <div class="features">
      <div class="feature">
        مزايا حصرية
        <span>✓</span>
      </div>
      <div class="feature">
        تحكم إضافي بالتطبيقات
        <span>✓</span>
      </div>
      <div class="feature">
        دعم سريع عبر الواتساب
        <span>✓</span>
      </div>
    </div>

    <div class="btn-group">
      <a href="#" class="btn">🔒 شراء الأكواد</a>
      <a href="https://wa.me/966XXXXXXXXX" class="btn secondary">💬 تواصل عبر واتساب</a>
    </div>

    <div class="footer">
      جميع الحقوق محفوظة © StarzStore 2025
    </div>
  </div>

</body>
</html>
