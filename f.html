<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>StarzStore</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(to bottom, #0d0d0d, #1c1c3a);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: #2c2c54;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      padding: 30px 25px;
      max-width: 400px;
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 25px;
    }

    .version {
      background-color: #1abc9c;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .message {
      font-size: 16px;
      margin-bottom: 25px;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
      transition: 0.3s;
    }

    .btn.whatsapp {
      background-color: #25d366;
    }

    .btn.codes {
      background-color: #ff6b35;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="logo" src="your-logo.png" alt="logo">
    <div class="title">StarzStore</div>
    <div class="subtitle">خلّي التطبيقات تشتغل على مزاجك</div>

    <div class="version">الإصدار: 17.10 | آخر تحديث: يوليو 2025</div>

    <div class="message">
      شكرًا لثقتك بنا 💜<br>
      انضم لعالم سناب بلس واستمتع بمزايا حصرية وتحكم إضافي يليق فيك.
    </div>

    <div class="buttons">
      <a href="#" class="btn codes">شراء الأكواد</a>
      <a href="https://wa.me/XXXXXXXXXX" class="btn whatsapp">واتساب</a>
    </div>

    <div class="footer">
      © StarzStore 2025 - جميع الحقوق محفوظة
    </div>
  </div>

</body>
</html>
