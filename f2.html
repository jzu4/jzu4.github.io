<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حقوق gالطبع والنشر - StarzStore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', Arial, sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: 80px; /* مساحة للنص السفلي */
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        /* Animated Gradient Background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(91, 79, 209, 0.4) 0%, transparent 30%),
                radial-gradient(circle at 80% 60%, rgba(255, 107, 53, 0.3) 0%, transparent 30%),
                radial-gradient(circle at 50% 90%, rgba(37, 211, 102, 0.3) 0%, transparent 30%);
            filter: blur(60px);
            animation: gradientMove 20s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes gradientMove {
            0%, 100% { transform: scale(1) rotate(0deg); }
            33% { transform: scale(1.1) rotate(120deg); }
            66% { transform: scale(0.9) rotate(240deg); }
        }

        /* Stars Effect */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: float-particle 25s linear infinite;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-100px) translateX(100px) scale(1);
                opacity: 0;
            }
        }

        /* Main Container Enhanced - إزالة حركة العوم */
        .container {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.95) 0%, rgba(15, 15, 15, 0.95) 100%);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 60px 45px;
            max-width: 650px;
            width: calc(100% - 40px);
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset,
                0 0 100px rgba(91, 79, 209, 0.2);
            /* تم إزالة animation: containerFloat */
        }

        /* Logo Section Enhanced */
        .logo-section {
            margin-bottom: 40px;
            position: relative;
        }

        .logo-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        /* Animated Border */
        .logo-border {
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, #5B4FD1, #FF6B35, #25D366, #8B7FE1);
            border-radius: 50%;
            animation: rotateBorder 3s linear infinite;
            z-index: 1;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo {
            position: relative;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
            box-shadow: 
                0 0 30px rgba(91, 79, 209, 0.5) inset,
                0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .logo img {
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-placeholder {
            font-size: 60px;
            background: linear-gradient(135deg, #5B4FD1, #8B7FE1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(91, 79, 209, 0.5));
        }

        /* Pulse Effect Behind Logo */
        .logo-pulse {
            position: absolute;
            inset: -50px;
            background: radial-gradient(circle, rgba(91, 79, 209, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Typography Enhanced */
        h1 {
            font-size: clamp(3rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -1px;
            position: relative;
            display: inline-block;
        }

        .title-main {
            background: linear-gradient(135deg, #ffffff 0%, #8B7FE1 50%, #ffffff 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShine 4s ease-in-out infinite;
            filter: drop-shadow(0 2px 10px rgba(91, 79, 209, 0.3));
        }

        @keyframes titleShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 1px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Divider Enhanced */
        .divider {
            width: 200px;
            height: 4px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 0;
            width: 100px;
            height: 100%;
            background: linear-gradient(90deg, transparent, #8B7FE1, transparent);
            animation: dividerMove 3s ease-in-out infinite;
        }

        .divider::after {
            animation-delay: 1.5s;
        }

        @keyframes dividerMove {
            0% { left: -100px; }
            100% { left: 200px; }
        }

        /* Year Badge Enhanced */
        .year-badge {
            display: inline-block;
            position: relative;
            margin-bottom: 30px;
        }

        .year {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 50%, #FF6B35 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            filter: drop-shadow(0 0 30px rgba(255, 107, 53, 0.5));
            animation: yearGlow 3s ease-in-out infinite;
        }

        @keyframes yearGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(255, 107, 53, 0.5));
                background-position: 0% 50%;
            }
            50% { 
                filter: drop-shadow(0 0 40px rgba(255, 107, 53, 0.8));
                background-position: 100% 50%;
            }
        }

        /* Copyright Text Enhanced */
        .copyright-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .copyright-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 8s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .text {
            font-size: 1.2rem;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.85);
            position: relative;
            z-index: 1;
        }

        /* Buttons Enhanced */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 45px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 20px 45px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .btn-store {
            background: linear-gradient(135deg, #5B4FD1 0%, #8B7FE1 100%);
            color: #ffffff;
            border: 2px solid transparent;
        }

        .btn-store:hover {
            border-color: rgba(139, 127, 225, 0.5);
            box-shadow: 0 15px 40px rgba(91, 79, 209, 0.4);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #2ECC71 100%);
            color: #ffffff;
            border: 2px solid transparent;
        }

        .btn-whatsapp:hover {
            border-color: rgba(46, 204, 113, 0.5);
            box-shadow: 0 15px 40px rgba(37, 211, 102, 0.4);
        }

        /* Icon Styles */
        .store-icon {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .store-icon img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .whatsapp-icon {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Footer Fixed - إصلاح موضع النص السفلي */
        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            z-index: 10;
            /* تم إزالة animation و transform */
        }

        .footer .heart {
            color: #FF6B35;
            display: inline-block;
            font-size: 1.1rem;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1) rotate(0deg); }
            10% { transform: scale(1.1) rotate(-5deg); }
            20% { transform: scale(1.2) rotate(5deg); }
            30% { transform: scale(1.1) rotate(-5deg); }
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            body {
                padding-bottom: 60px;
            }
            
            .container {
                padding: 40px 30px;
                width: calc(100% - 20px);
            }
            
            .logo-wrapper {
                width: 120px;
                height: 120px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .year {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .text {
                font-size: 1.05rem;
            }
            
            .buttons {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
                padding: 18px 35px;
            }
            
            .footer {
                font-size: 0.85rem;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="gradient-bg"></div>
    
    <!-- Stars -->
    <div class="stars" id="stars"></div>
    
    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-wrapper">
                <div class="logo-pulse"></div>
                <div class="logo-border"></div>
                <div class="logo">
                    <!-- ضع صورة متجرك هنا -->
                    <img src="E6200FA4-4200-472B-9502-A30911D06A87.png" alt="StarzStore Logo">
                    <!-- 
                    لإضافة صورة متجرك، احذف السطر أعلاه واستخدم:
                    <img src="store-logo.png" alt="StarzStore Logo">
                    -->
                </div>
            </div>
        </div>
        
        <h1 class="title-main">StarzStore</h1>
        <p class="subtitle">نخبة التطبيقات تشتغل على مزاجك</p>
        

        <div class="divider"></div>
        
        <div class="buttons">
            <a href="#" class="btn btn-store">
                <span class="store-icon">
                    <!-- ضع شعار متجرك الصغير هنا -->
                    <!-- <img src="store-icon.png" alt="Store"> -->
                    🛍️
                </span>
                <span>المتجر الإلكتروني</span>
            </a>
            <a href="#" class="btn btn-whatsapp">
                <svg class="whatsapp-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                </svg>
                <span>واتساب</span>
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        صُمم بكل <span class="heart">💙</span> StarzStore
    </div>

    <script>
        // Create stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            starsContainer.appendChild(star);
        }

        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        const particleColors = ['#5B4FD1', '#FF6B35', '#25D366', '#8B7FE1'];
        
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 6 + 3;
            const color = particleColors[Math.floor(Math.random() * particleColors.length)];
            const left = Math.random() * 100;
            const animationDuration = Math.random() * 10 + 25;
            const animationDelay = Math.random() * 5;
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = left + '%';
            particle.style.background = color;
            particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;
            particle.style.animationDuration = animationDuration + 's';
            particle.style.animationDelay = animationDelay + 's';
            
            particlesContainer.appendChild(particle);
            
            setTimeout(() => {
                if (particle.parentNode) {
                    particle.remove();
                }
            }, (animationDuration + animationDelay) * 1000);
        }
        
        // Create initial particles
        for (let i = 0; i < 8; i++) {
            setTimeout(createParticle, i * 500);
        }
        
        // Continue creating particles
        setInterval(createParticle, 2000);
    </script>
</body>
</html>
