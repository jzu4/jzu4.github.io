<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>قنوات البث</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
      padding: 20px;
      direction: rtl;
    }
    .channel {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 0 10px #0005;
    }
    .channel img {
      width: 100px;
      height: auto;
      border-radius: 8px;
    }
    .channel-info {
      flex: 1;
    }
    .channel-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .channel-category {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 10px;
    }
    .watch-button {
      padding: 10px 15px;
      background-color: #0a84ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    .watch-button:hover {
      background-color: #006edc;
    }
  </style>
</head>
<body>

  <h1>📡 قنوات البث المباشر</h1>
  <div id="channels"></div>

  <script>
    fetch("https://jzu4.github.io/files/json/rives.json")
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("channels");
        const channels = data.channels;

        channels.forEach(channel => {
          const box = document.createElement("div");
          box.className = "channel";

          box.innerHTML = `
            <img src="${channel.logo}" alt="شعار القناة">
            <div class="channel-info">
              <div class="channel-title">${channel.name}</div>
              <div class="channel-category">📁 ${channel.category}</div>
              <a class="watch-button" href="${channel.url}" target="_blank">🎬 مشاهدة</a>
            </div>
          `;

          container.appendChild(box);
        });
      })
      .catch(error => {
        document.getElementById("channels").innerHTML = "⚠️ حدث خطأ أثناء تحميل القنوات.";
        console.error("Fetch error:", error);
      });
  </script>

</body>
</html>
