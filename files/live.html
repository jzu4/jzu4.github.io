<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>قنوات البث</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #fff;
      padding: 20px;
      direction: rtl;
    }
    .channel {
      background-color: #222;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .channel img {
      width: 100px;
      height: auto;
      border-radius: 8px;
    }
    .channel-info {
      flex: 1;
    }
    .channel-title {
      font-size: 20px;
      margin-bottom: 5px;
    }
    .watch-button {
      padding: 10px 15px;
      background-color: #0a84ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>📺 قنوات البث المباشر</h1>
  <div id="channels"></div>

  <script>
    fetch("https://jzu4.github.io/files/json/rives.json")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("channels");

        data.forEach(channel => {
          const box = document.createElement("div");
          box.className = "channel";

          box.innerHTML = `
            <img src="${channel.image}" alt="صورة القناة">
            <div class="channel-info">
              <div class="channel-title">${channel.name}</div>
              <a class="watch-button" href="${channel.url}" target="_blank">مشاهدة</a>
            </div>
          `;

          container.appendChild(box);
        });
      })
      .catch(err => {
        document.getElementById("channels").innerHTML = "حدث خطأ أثناء تحميل القنوات.";
        console.error(err);
      });
  </script>

</body>
</html>
